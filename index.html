<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ポケスリ My厳選Tier</title>
    <link rel="stylesheet" href="styles.css?v=20260521-3" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div>
          <h1>ポケスリ マイ厳選Tier</h1>
          <p>
            自分の厳選状況を整理して端末に保存できます。
            整理することで、サブレの無駄遣いを減らすための判断に役立てられます。
            <br />
            Tierの元情報は
            <a href="https://game8.jp/pokemonsleep/542600" target="_blank" rel="noopener">Game8の最強ポケモンランキングTier表</a>
            から取得しています。自分用に置き換えてください。
          </p>
        </div>
        <div class="header-actions">
          <button id="exportButton" class="primary-button" type="button">画像保存</button>
          <button id="addTierButton" type="button">Tier追加</button>
          <button id="resetButton" class="danger-button" type="button">リセット</button>
        </div>
      </header>

      <div class="tier-filter-bar">
        <label class="filter-field filter-search">
          <span>検索</span>
          <input id="searchInput" type="search" placeholder="ポケモン名・タイプ・得意" autocomplete="off" />
        </label>
        <div class="filter-field filter-specialty">
          <span>得意</span>
          <div class="filter-row" aria-label="得意カテゴリ">
            <button class="filter-chip active" type="button" data-specialty="all">すべて</button>
            <button class="filter-chip" type="button" data-specialty="きのみ">きのみ</button>
            <button class="filter-chip" type="button" data-specialty="食材">食材</button>
            <button class="filter-chip" type="button" data-specialty="スキル">スキル</button>
            <button class="filter-chip" type="button" data-specialty="オール">オール</button>
          </div>
        </div>
        <label class="filter-field">
          <span>タイプ</span>
          <select id="typeFilter" aria-label="タイプで絞り込み">
            <option value="all">全タイプ</option>
          </select>
        </label>
        <label class="filter-field">
          <span>フィールド</span>
          <select id="fieldFilter" aria-label="出現フィールドで絞り込み">
            <option value="all">全フィールド</option>
          </select>
        </label>
        <label class="filter-field">
          <span>食材対象</span>
          <select id="ingredientScopeFilter" aria-label="食材フィルター対象">
            <option value="all">全食材</option>
            <option value="first">第1食材のみ</option>
            <option value="first-second">第1・第2食材のみ</option>
          </select>
        </label>
        <label class="filter-field">
          <span>食材</span>
          <select id="ingredientFilter" aria-label="食材で絞り込み">
            <option value="all">食材を選択</option>
          </select>
        </label>
      </div>

      <main class="workspace">
        <div class="board-column">
          <section class="tier-panel unfinished-panel" aria-label="厳選未完了">
            <div class="section-title-row">
              <h2>厳選管理表</h2>
            </div>
            <div id="tierBoard" class="tier-board"></div>
          </section>

          <aside class="pokemon-panel" aria-label="未配置ポケモン">
            <div class="panel-head">
              <div>
                <h2>未配置</h2>
                <span id="poolCount"></span>
              </div>
            </div>
            <div id="pokemonPool" class="pokemon-grid"></div>
          </aside>
        </div>

        <aside class="status-column" aria-label="整理済みポケモン">
          <section class="compact-panel compromise-panel" aria-label="妥協個体あり">
            <div class="panel-head">
              <div>
                <h2>妥協個体あり</h2>
                <span id="compromiseCount"></span>
              </div>
            </div>
            <div id="compromisePool" class="compact-board"></div>
          </section>

          <section class="compact-panel finished-panel" aria-label="厳選完了ポケモン">
            <div class="panel-head">
              <div>
                <h2>厳選完了</h2>
                <span id="finishedCount"></span>
              </div>
            </div>
            <div id="finishedPool" class="compact-board"></div>
          </section>
        </aside>
      </main>

      <footer class="site-footer">
        <nav aria-label="サイト情報">
          <a href="about.html">このサイトについて</a>
          <a href="privacy.html">プライバシーポリシー</a>
        </nav>
        <p>Pokemon Sleep My Tier is an unofficial fan-made tool.</p>
      </footer>
    </div>

    <dialog id="moveDialog">
      <form method="dialog">
        <div class="dialog-title-row">
          <h2 id="dialogPokemonName"></h2>
          <button id="detailButton" class="detail-link" type="button">検索</button>
        </div>
        <div id="pokemonInfoFields" class="pokemon-info-fields"></div>
        <div id="moveTargets" class="move-targets"></div>
        <button value="cancel" type="submit">閉じる</button>
      </form>
    </dialog>

    <script src="app.js?v=20260521-4"></script>
  </body>
</html>
